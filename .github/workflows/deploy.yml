name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Wait for GitHub Pages activation
        run: |
          echo "Please enable GitHub Pages in repository settings:"
          echo "https://github.com/${{ github.repository }}/settings/pages"
          echo "Then push any change to trigger deployment again."
        if: ${{ !github.event.repository.has_pages }}

      - name: Setup Pages
        uses: actions/configure-pages@v4
        if: ${{ github.event.repository.has_pages }}
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
        if: ${{ github.event.repository.has_pages }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.repository.has_pages }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4